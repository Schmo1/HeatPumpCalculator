<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1c5cab" />
    <title>Heat Pump Billing</title>
    <script>
      // Stamp a stored theme choice before first paint, otherwise an explicit
      // light choice flashes dark on an OS set to dark. No choice stored means
      // no stamp, so the prefers-color-scheme rules stay in charge.
      try {
        var t = localStorage.getItem("hp_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) { /* storage blocked - fall back to the OS setting */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
